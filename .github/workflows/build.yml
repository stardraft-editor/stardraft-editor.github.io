# Builds index.html from the roadmap (docs/project/ROADMAP.md in stardraft-editor/stardraft) and commits it when it
# changes. Runs after a push here, each day, and by hand. (A push of ROADMAP.md to stardraft also rebuilds the page:
# stardraft's Roadmap workflow runs build.py and pushes index.html here.)
name: Build

on:
  push:
    branches: [main]
    paths: [build.py, assets/icons/**, .github/workflows/build.yml]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python build.py
      - name: Commit it when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html
          if git diff --cached --quiet; then
            echo "The page is up to date."
          else
            git commit -m "Page from the roadmap (stardraft main)"
            git push
          fi
